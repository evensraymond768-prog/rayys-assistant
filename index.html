<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Rayy’s Assistant</title>
</head>
<body>
<div id="app">
  <header>
    <div><div class="brand">Rayy’s Assistant</div><div class="date" id="todayLabel"></div></div>
    <button class="iconBtn" id="settingsBtn">⚙️</button>
  </header>

  <main>
    <section id="goals" class="screen">
      <div class="sectionHead"><h1>Goals</h1><button class="primary" id="addGoal">＋ Goal</button></div>
      <div id="goalsList"></div>
    </section>

    <section id="reminders" class="screen active">
      <div class="sectionHead"><h1>Today</h1><button class="primary" id="addReminder">＋ Reminder</button></div>
      <div class="quick">
        <input id="quickInput" placeholder='Try: "Remind me tomorrow at 7 PM to do homework"'>
        <button id="quickAdd">Add</button>
      </div>
      <div id="remindersList"></div>
      <div id="empty" class="empty">Nothing left for today 🎉</div>
    </section>

    <section id="schedule" class="screen">
      <div class="sectionHead"><button class="monthBtn" id="prevMonth">‹</button><h1 id="monthTitle"></h1><button class="monthBtn" id="nextMonth">›</button></div>
      <div class="calendar" id="calendar"></div>
      <div class="repeatInfo"><b>Recurring tasks</b><div id="recurringList"></div></div>
    </section>
  </main>

  <nav>
    <button data-tab="goals">🎯<span>Goals</span></button>
    <button data-tab="reminders" class="selected">🔔<span>Reminders</span></button>
    <button data-tab="schedule">📅<span>Schedule</span></button>
  </nav>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheetHead"><h2 id="modalTitle">New Reminder</h2><button id="closeModal">✕</button></div>
    <label>Task<input id="task"></label>
    <div class="row"><label>Date<input id="date" type="date"></label><label>Time<input id="time" type="time"></label></div>
    <label>Repeat
      <select id="repeat"><option value="none">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="custom">Custom</option></select>
    </label>
    <div id="customDays" class="days hidden"></div>
    <label>Location<input id="location" placeholder="Optional"></label>
    <label>Notes<textarea id="notes" rows="3"></textarea></label>
    <div class="prefs"><label><input id="sound" type="checkbox" checked> Sound</label><label><input id="vibrate" type="checkbox" checked> Vibration</label></div>
    <button class="save" id="saveReminder">Save Reminder</button>
  </div>
</div>

<div class="modal" id="goalModal">
  <div class="sheet">
    <div class="sheetHead"><h2>New Goal</h2><button id="closeGoal">✕</button></div>
    <label>Goal<input id="goalName" placeholder="e.g. Finish my degree"></label>
    <label>Target date<input id="goalDate" type="date"></label>
    <label>Progress <input id="goalProgress" type="range" min="0" max="100" value="0"><b id="progressValue">0%</b></label>
    <label>Notes<textarea id="goalNotes" rows="3"></textarea></label>
    <button class="save" id="saveGoal">Save Goal</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
